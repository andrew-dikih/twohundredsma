name: CD - Deploy to Azure Container Apps

on:
  push:
    branches:
      - develop
    # Passive documentation-only boundary (mirrors ci.yml -- keep both in
    # sync; tests/test_ci_docs_only_gating.py asserts they match). A push
    # to develop that touches ONLY these root docs never builds or deploys
    # an image. Deliberately a narrow allowlist of exact filenames (never a
    # wildcard like **/*.md) so README/reference docs can never be confused
    # with deployable output (e.g. a future dist/docs/** or docs shipped
    # under advisor/templates/). Any other file, or a mixed diff, deploys
    # normally. workflow_dispatch is manual and always runs regardless of
    # this filter.
    #
    # KNOWN LIMITATION: GitHub only evaluates path filters against the
    # first 3,000 changed files of a push/diff. See
    # .github/DOCS_ONLY_CI_GATING.md -- for very large pushes, treat a
    # skipped run as indeterminate, not a verified no-op, and validate/
    # dispatch manually if needed.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'OPTIONS_RULES.md'
      - 'STRATEGY_RULES.md'
  workflow_dispatch: {}

env:
  REGISTRY: ${{ vars.AZURE_REGISTRY_URL }}
  IMAGE: ${{ vars.AZURE_REGISTRY_URL }}/twohundredsma
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions: {}
    environment:
      name: develop
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure registry on Container App
        run: |
          az containerapp registry set \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --server ${{ vars.AZURE_REGISTRY_URL }} \
            --username ${{ vars.AZURE_REGISTRY_USERNAME }} \
            --password "${{ secrets.AZURE_REGISTRY_PASSWORD }}"

      - name: Sync secrets on Container App
        env:
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
          GITHUB_TOKEN_APP: ${{ secrets.APP_GITHUB_TOKEN }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: |
          # Always include cosmos. Only set the AI/GitHub secrets if they are
          # provided so the workflow keeps working before they are configured.
          SECRETS=("cosmos-connection-string=$COSMOS_CONNECTION_STRING")
          if [ -n "$GITHUB_TOKEN_APP" ]; then
            SECRETS+=("app-github-token=$GITHUB_TOKEN_APP")
          fi
          az containerapp secret set \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --secrets "${SECRETS[@]}"

      - name: Update image and environment
        env:
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          COSMOS_DATABASE: ${{ vars.AZURE_COSMOS_DATABASE }}
        run: |
          ENV_VARS=(
            "COSMOS_CONNECTION_STRING=secretref:cosmos-connection-string"
            "COSMOS_DATABASE=${COSMOS_DATABASE:-TwoHundredSMA}"
            "COSMOS_CONTAINER=Documents"
            "ADMIN_USERNAME=${ADMIN_USERNAME:-andrewdikih}"
            "AI_REVIEW_MODEL=${AI_REVIEW_MODEL:-openai/gpt-4.1}"
          )
          if az containerapp secret show \
              --name ${{ vars.AZURE_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --secret-name app-github-token >/dev/null 2>&1; then
            ENV_VARS+=("GITHUB_TOKEN=secretref:app-github-token")
          fi

          az containerapp update \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars "${ENV_VARS[@]}"

      - name: Show app URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.AZURE_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed: https://$FQDN"
          echo "## :rocket: Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://$FQDN>" >> "$GITHUB_STEP_SUMMARY"
