name: CI - Tests, lint & image build

on:
  pull_request:
    branches:
      - main
      - develop
    # Passive documentation-only boundary: this is a narrow, explicit
    # allowlist of root-level human-readable docs that carry no runtime
    # behavior (nothing in advisor/, scripts/, tests/, templates/, or
    # .github/** references or parses these files). Any PR whose diff
    # touches ONLY these paths never triggers this workflow (trigger-level
    # filter, zero runner minutes) -- not a job that runs and then skips.
    # A mixed PR (docs + anything else) still runs normally: GitHub only
    # skips the workflow when every changed file matches paths-ignore.
    #
    # KNOWN LIMITATION (see .github/DOCS_ONLY_CI_GATING.md): GitHub only
    # evaluates paths-ignore/paths filters against the first 3,000 changed
    # files of a diff. For PRs at/above that size, GitHub's own filter
    # evaluation is not verified complete -- do not treat a "skipped" run
    # as a fail-closed guarantee; split the PR or manually dispatch this
    # workflow (see workflow_dispatch below).
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'OPTIONS_RULES.md'
      - 'STRATEGY_RULES.md'
  # Manual full-CI recovery control: lets a human force this workflow to run
  # regardless of the paths-ignore filter above (e.g. to validate an
  # oversized diff that GitHub's path-filter evaluation cannot be trusted
  # for -- see the >=3,000-file limitation in
  # .github/DOCS_ONLY_CI_GATING.md). Not path-filtered and does not change
  # normal pull_request-triggered behavior.
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python:
    name: Python compile + tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q advisor scripts

      - name: Import advisor.app (smoke)
        env:
          # Force SQLite path during CI so we don't need real Cosmos creds.
          COSMOS_CONNECTION_STRING: ""
        run: |
          python - <<'PY'
          import importlib
          for mod in ["advisor.state", "advisor.auth", "advisor.app",
                      "advisor.engine", "advisor.service",
                      "advisor.store_cosmos"]:
              importlib.import_module(mod)
              print(f"ok: {mod}")
          PY

      - name: Unit + integration tests
        env:
          # Tests run against an isolated SQLite tmp DB per test (see conftest).
          COSMOS_CONNECTION_STRING: ""
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile
          push: false
          load: true
          tags: twohundredsma:ci

