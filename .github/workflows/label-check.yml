name: Require Release Label for Main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    # Passive documentation-only boundary (mirrors ci.yml/deploy.yml -- kept
    # in sync; see tests/test_ci_docs_only_gating.py). A PR to main whose
    # diff touches ONLY these root docs never triggers this policy check, so
    # it costs zero runner minutes. This means a docs-only PR to main does
    # not need the "release" label -- acceptable because no deploy is ever
    # triggered by these files (deploy.yml only builds/pushes from develop).
    # A mixed PR still runs the check normally.
    #
    # KNOWN LIMITATION: see .github/DOCS_ONLY_CI_GATING.md -- GitHub path
    # filters are unverified beyond the first 3,000 changed files of a diff.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'OPTIONS_RULES.md'
      - 'STRATEGY_RULES.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-release-label:
    name: Check for release label
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check for 'release' label
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            console.log('PR labels:', labels);
            if (!labels.includes('release')) {
              core.setFailed(
                'PRs to main must be labeled "release" to indicate a production deploy. ' +
                'Please add the "release" label to this pull request.'
              );
            } else {
              console.log('Release label found. Check passed.');
            }
