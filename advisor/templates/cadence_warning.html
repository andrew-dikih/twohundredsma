{% extends "base.html" %}
{% block content %}
<div class="alert alert-warning">
  <h4>Cadence warning</h4>
  <p>{{ reason }}</p>
  <form method="post" action="/run">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="force" value="1">
    <input type="hidden" name="force_rebalance" value="{{ force_rebalance or '' }}">
    <button class="btn btn-warning" type="submit">Run anyway (override cadence)</button>
    <a class="btn btn-secondary" href="/">Cancel</a>
  </form>
</div>
{% endblock %}
