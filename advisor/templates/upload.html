{% extends "base.html" %}
{% block content %}
<h2 class="h4">Upload Fidelity portfolio CSV</h2>
<p class="text-muted">From Fidelity: <em>Accounts &amp; Trade → Portfolio → Download (CSV)</em>. Cash sweep positions (SPAXX, FZFXX, FDRXX) are auto-detected.</p>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" enctype="multipart/form-data" action="/upload" class="card card-body">
  <div class="mb-3">
    <label class="form-label">CSV file</label>
    <input type="file" name="file" accept=".csv,text/csv" required class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Parse</button>
</form>
{% endblock %}
